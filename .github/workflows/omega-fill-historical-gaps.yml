name: OMEGA complete missing historical market sessions 2021-2025
on:
  push:
    branches: [omega-2021-2026-contiguous-research-20261109]
    paths: [.github/workflows/omega-fill-historical-gaps.yml]
  workflow_dispatch:
jobs:
  close-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        study:
          - { name: early2021, start: '2021-01-04', end: '2021-02-26' }
          - { name: late2022_early2023, start: '2022-08-17', end: '2023-04-28' }
          - { name: winter2024, start: '2023-12-01', end: '2024-02-29' }
          - { name: late2025, start: '2025-11-03', end: '2025-11-17' }
    steps:
      - uses: actions/checkout@v4
      - name: Install history and market calendar packages
        run: pip -q install numpy pandas pyarrow huggingface_hub yfinance
      - name: Historical daily scanner with no future label leakage
        env:
          STUDY_START: ${{ matrix.study.start }}
          STUDY_END: ${{ matrix.study.end }}
        run: python omega_fill_missing_2021_2025.py
      - name: Upload missing-market-data scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-missing-${{ matrix.study.name }}
          path: omega_new_gap_${{ matrix.study.start }}_${{ matrix.study.end }}/
          retention-days: 14
