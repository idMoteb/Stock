name: OMEGA 2023 virgin independent stress-test archive
on:
  push:
    branches: [omega-85plus-independent-validation-20261109]
  workflow_dispatch:
jobs:
  historical2023:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: pip -q install numpy pandas pyarrow huggingface_hub yfinance
      - name: Scan 2023 US universe using 2022 trailing history
        run: python omega_research_2023_pristine.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-historical-2023-new-cohort
          path: omega_holdout_2023/
          retention-days: 14
