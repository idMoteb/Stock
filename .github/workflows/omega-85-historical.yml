name: OMEGA 2024-2025 independent 85pct validation
on:
  push:
    branches: [omega-85plus-independent-validation-20261109]
  workflow_dispatch:
jobs:
  multi-year-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip -q install pandas numpy pyarrow huggingface_hub yfinance
      - name: Download 7000-stock 2024-2025 archive and run frozen local SGX research proxy
        run: python omega_research_2024_2025_validation.py
      - name: Upload independently validated signal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-2024-2025-independent-holdout
          path: omega_holdout_2024_2025/
          retention-days: 14
