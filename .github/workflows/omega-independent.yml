name: OMEGA independent market data probe
on:
  push:
    branches:
      - omega-research-independent-20261108
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe public OHLCV file schemas and access
        run: |
          python - <<'PY'
          import urllib.request,json
          for repo in ['AlphaDojo/dojo_stock_kline','AlphaDojo/dojo_stock_info']:
              url='https://huggingface.co/api/datasets/'+repo+'/tree/main?recursive=true&expand=true'
              try:
                result=json.load(urllib.request.urlopen(url,timeout=20))
                print('REPO',repo,'FILES',[(x.get('path'),x.get('size')) for x in result[:30]])
              except Exception as exc:print('ERR',repo,str(exc)[:500])
          PY
