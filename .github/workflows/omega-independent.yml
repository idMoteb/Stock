name: OMEGA independent 1000+ daily SGX scientific research
on:
  push:
    branches: [omega-research-independent-20261108]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip -q install pandas numpy pyarrow huggingface_hub yfinance
      - name: Download independent market data and run scanner
        run: |
          python omega_research_janfeb.py
      - name: Upload independent research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-independent-jan-feb-2026
          path: omega_janfeb_outputs/
          retention-days: 7
