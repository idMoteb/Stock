name: OMEGA final all-period independent market downside audit
on:
  push:
    branches: [omega-research-independent-20261108]
  workflow_dispatch:
jobs:
  risk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        period: [jan, mar, aug]
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: pip -q install pandas numpy pyarrow huggingface_hub yfinance
      - name: Scan independent OHLCV and measure 20-session adverse excursion
        run: python omega_research_risk_${{ matrix.period }}.py
      - name: Save risk audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-final-risk-${{ matrix.period }}
          path: omega_risk_${{ matrix.period }}/
          retention-days: 14
