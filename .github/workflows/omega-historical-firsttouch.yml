name: OMEGA 2023 to 2025 cross-era next-open stop-loss validation
on:
  push:
    branches: [omega-85plus-independent-validation-20261109]
    paths: [.github/workflows/omega-historical-firsttouch.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historical-first-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install requirements
        run: pip -q install numpy pandas pyarrow huggingface_hub exchange_calendars
      - name: Download archived 2023-2025 scanner evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded/old downloaded/y2023
          gh run download 42570294837 -R idMoteb/Stock -n omega-2024-2025-independent-holdout -D downloaded/old
          gh run download 42573630736 -R idMoteb/Stock -n omega-historical-2023-new-cohort -D downloaded/y2023
      - name: Replay next-open target and stop in historical OHLCV
        run: python omega_historical_firsttouch.py
      - name: Keep auditable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-historical-next-open-replay
          path: omega_historical_firsttouch_results/
          retention-days: 14
